<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ISP Control — التحكم بالراوترين</title>
<style>body{font:16px system-ui;background:#f1f5f9;color:#14233b;margin:0}main{max-width:1000px;margin:30px auto;padding:24px;background:white;border-radius:18px}input,select,textarea,button{font:inherit;padding:12px;border:1px solid #ccd5e1;border-radius:8px;box-sizing:border-box}textarea{width:100%;min-height:130px;direction:ltr;text-align:left}button{background:#135bd8;color:white;cursor:pointer}button:disabled{opacity:.4;cursor:default}label{display:block;margin:14px 0 6px}pre{white-space:pre-wrap;overflow-wrap:anywhere;direction:ltr;text-align:left;background:#edf2f7;padding:14px;border-radius:8px}section{margin:22px 0}small{color:#52627a}.row{display:flex;gap:12px;flex-wrap:wrap}.error{color:#a62323}article{border-top:1px solid #ddd;padding:12px 0}[hidden]{display:none!important}</style>
<main><h1>التحكم بالراوترين</h1><p>حساب مالك ISP Control فقط. تختار الجهاز، تنفّذ أمراً، وتراجع النتيجة الفعلية.</p>
<form id="login"><label for="username">اسم المستخدم أو البريد</label><input id="username" autocomplete="username" required><label for="password">كلمة المرور الحالية</label><input id="password" type="password" autocomplete="current-password" required><p><button>دخول</button></p></form>
<p id="status" role="status"></p><section id="console" hidden><div class="row"><button id="logout">خروج</button><button id="refresh">تحديث</button></div><p id="channel"></p><p id="subscriberState"></p><button id="subscriberMode">تغيير وضع أوامر المشتركين</button><label for="router">الجهاز المستهدف</label><select id="router"></select><label for="preset">أمر جاهز</label><select id="preset"><option value="/system identity print">قراءة اسم الجهاز</option><option value="/system resource print">قراءة الموارد</option><option value="/interface print">قراءة الواجهات</option><option value="">أمر مخصص</option></select><label for="script">أمر RouterOS</label><textarea id="script" spellcheck="false">/system identity print</textarea><p><small>الأوامر المخصصة تعمل بصلاحيات إدارية. العمليات التي تقطع اتصال الجهاز قد تنتهي بدون تأكيد؛ لا تعِدها تلقائياً.</small></p><button id="run" disabled>تنفيذ على الجهاز المحدد</button><h2>سجل الأوامر والنتائج</h2><div id="jobs"></div></section></main>
<script>
const BASE='https://varccsjoydhlfazaizqs.supabase.co',KEY='sb_publishable_3M9BkewAJ3i6daQc_Sojbw_WA2ryzm9';
const el=id=>document.getElementById(id);let session=null,routers=[],busy=false,timer=null;
const status=(s,error=false)=>{el('status').textContent=s;el('status').className=error?'error':''};
async function request(path,body,auth=true,method='POST'){
 if(auth&&session&&Date.now()>session.expires_at-30000){const r=await request('/auth/v1/token?grant_type=refresh_token',{refresh_token:session.refresh_token},false);session={...r,expires_at:Date.now()+r.expires_in*1000};}
 const r=await fetch(BASE+path,{method,headers:{apikey:KEY,'Content-Type':'application/json',...(auth&&session?{Authorization:'Bearer '+session.access_token}:{})},...(method==='GET'?{}:{body:JSON.stringify(body)})});
 const data=await r.json();if(!r.ok)throw Error(data.error_description||data.msg||data.error||data.message||'تعذر تنفيذ الطلب');return data;
}
const control=body=>request('/functions/v1/isp-router-control',body);
function availability(){const c=routers.find(r=>r.device_role==='CONNECTOR');const live=c&&c.command_channel_version===3&&Date.now()-Date.parse(c.command_channel_last_seen_at)<20000;el('run').disabled=busy||!live;el('channel').textContent=live?'قناة V3 متصلة — تنفيذ مستقل على RB951 وRB1100':'قناة V3 غير متصلة. أكمل استيراد الملف على RB1100 ثم RB951.';return live;}
async function refresh(){
 if(!session||busy)return;
 try{routers=await request('/rest/v1/routers?select=id,name,model,device_role,command_channel_last_seen_at,command_channel_version,command_channel_subscriber_enabled',null,true,'GET');
 const enabled=routers.find(r=>r.device_role==='CONNECTOR')?.command_channel_subscriber_enabled===true;el('subscriberState').textContent=enabled?'أوامر المشتركين مسموحة؛ الطلبات المعلقة قد تُنفذ.':'أوامر المشتركين متوقفة احتياطياً؛ التثبيت لا يطبق أي طلبات قديمة.';el('subscriberMode').textContent=enabled?'إيقاف سحب أوامر المشتركين':'السماح بسحب أوامر المشتركين';
 const previous=el('router').value;el('router').replaceChildren();for(const r of routers.filter(r=>['CORE','CONNECTOR'].includes(r.device_role))){const o=document.createElement('option');o.value=r.id;o.textContent=(r.device_role==='CORE'?'RB1100':'RB951')+' — '+r.name;el('router').append(o);}if(routers.some(r=>r.id===previous))el('router').value=previous;
 availability();const {jobs=[]}=await control({action:'list'});el('jobs').replaceChildren();for(const j of jobs){const a=document.createElement('article'),h=document.createElement('strong'),p=document.createElement('pre'),o=document.createElement('pre');h.textContent=(routers.find(r=>r.id===j.router_id)?.model||j.router_id)+' — '+j.status+' — '+new Date(j.created_at).toLocaleString();p.textContent=j.script;o.textContent=j.output||(j.status==='COMPLETED'?'اكتمل بدون قيمة إرجاع.':'بانتظار نتيجة مؤكدة');a.append(h,p,o);if(j.status==='PENDING'){const cancel=document.createElement('button');cancel.textContent='إلغاء قبل التنفيذ';cancel.onclick=async()=>{try{await control({action:'cancel',id:j.id});await refresh();}catch(e){status(e.message,true)}};a.append(cancel);}el('jobs').append(a);}
 }catch(e){el('run').disabled=true;status(e.message,true);}
}
el('login').onsubmit=async e=>{e.preventDefault();try{status('جاري الدخول…');let email=el('username').value.trim();if(!email.includes('@'))email=await request('/rest/v1/rpc/resolve_login_email',{p_username:email},false);if(!email)throw Error('بيانات الدخول غير صحيحة');const r=await request('/auth/v1/token?grant_type=password',{email,password:el('password').value},false);session={...r,expires_at:Date.now()+r.expires_in*1000};el('password').value='';await control({action:'list'});el('login').hidden=true;el('console').hidden=false;status('تم الدخول بحساب المالك');await refresh();timer=setInterval(()=>{if(!document.hidden)refresh()},5000);}catch(e){session=null;status(e.message,true)}};
el('logout').onclick=()=>{clearInterval(timer);session=null;el('console').hidden=true;el('login').hidden=false;el('jobs').replaceChildren();status('تم الخروج من لوحة التحكم هذه')};
el('preset').onchange=()=>{if(el('preset').value)el('script').value=el('preset').value};el('refresh').onclick=refresh;
el('subscriberMode').onclick=async()=>{const enabled=routers.find(r=>r.device_role==='CONNECTOR')?.command_channel_subscriber_enabled===true;if(!confirm(enabled?'إيقاف السحب الجديد؟ الأمر الجاري قد يكتمل.':'السماح بتنفيذ طلبات المشتركين المعلقة والجديدة؟ راجعها في ISP Control أولاً.'))return;try{await control({action:'channel_mode',enabled:!enabled});await refresh();}catch(e){status(e.message,true)}};
el('run').onclick=async()=>{if(!availability())return;const router=routers.find(r=>r.id===el('router').value),script=el('script').value.trim();if(!router||!script)return;if(!confirm('تنفيذ على '+router.model+' ('+router.device_role+')؟\n\n'+script))return;busy=true;availability();try{const id=crypto.randomUUID?crypto.randomUUID():URL.createObjectURL(new Blob()).split('/').pop();const job=await control({action:'enqueue',router_id:router.id,script,confirmed:true,request_id:id});status('تم إرسال الأمر '+job.id+'؛ انتظر النتيجة في السجل.');}catch(e){status(e.message,true)}finally{busy=false;await refresh()}};
</script></html>
